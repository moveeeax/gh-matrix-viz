name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        py: ["3.9", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            py: "3.9"
        include:
          - os: ubuntu-latest
            py: "3.12"
            coverage: true

  lint:
    runs-on: ubuntu-latest

  test:
    needs: build
    runs-on: ubuntu-latest

  deploy:
    needs: [build, lint, test]
    runs-on: ubuntu-latest
