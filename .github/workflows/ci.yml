name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]" || pip install -e . pytest
      - name: Test
        run: pytest
      - name: Smoke-test the CLI
        run: |
          gh-matrix-viz examples/ci.yml --format both
          gh-matrix-viz examples/ci.yml --format graph --job build
