name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]" || pip install -e . pytest
      - name: Test
        run: pytest
      - name: Smoke-test the CLI
        run: |
          gh-matrix-viz examples/ci.yml --format both
          gh-matrix-viz examples/ci.yml --format graph --job build
