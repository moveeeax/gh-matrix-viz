[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-matrix-viz"
version = "0.2.0"
description = "Render a GitHub Actions workflow job matrix as a readable table or graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["github-actions", "ci", "matrix", "workflow", "visualization", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/moveeeax/gh-matrix-viz"

[project.scripts]
gh-matrix-viz = "gh_matrix_viz.cli:main"

[tool.setuptools]
packages = ["gh_matrix_viz"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
